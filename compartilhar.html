<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compartilhar Loja - ClickBus Burguer</title>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/compartilhar.css" />
  </head>

  <body>
    <header class="topo">
      <a href="index.html" class="area-logo">
        <img src="img/logo-topo.png" alt="Logo ClickBus Burguer" />
      </a>

      <a href="cardapio.html" class="botao-voltar">↩ Voltar</a>
    </header>

    <main class="pagina-compartilhar">
      <section class="compartilhar-card">
        <div class="texto-compartilhar">
          <h1>Bus Burguer | Delivery em Sandolândia | Pedido online</h1>

          <p>
            Faça seu pedido online agora mesmo no Bus Burguer!<br />
            Seu delivery em Sandolândia. Acesse a loja através do cardápio
            digital web.
          </p>

          <p class="link-loja">
            Acesse o cardápio de Bus Burguer:
            <span id="linkLojaCompartilhar">cardapio.html</span>
          </p>
        </div>

        <div class="redes-compartilhar">
          <button type="button" onclick="compartilharWhatsApp()">
            <img
              src="img/whatsapp.png"
              alt="WhatsApp"
              class="img-rede-social"
            />
            WhatsApp
          </button>

          <button type="button" onclick="compartilharMessenger()">
            <img
              src="img/messenger.png"
              alt="Messenger"
              class="img-rede-social"
            />
            Messenger
          </button>

          <button type="button" onclick="compartilharInstagram()">
            <img
              src="img/instagram.png"
              alt="Instagram"
              class="img-rede-social"
            />
            Instagram
          </button>

          <button type="button" onclick="compartilharTelegram()">
            <img
              src="img/telegram.png"
              alt="Telegram"
              class="img-rede-social"
            />
            Telegram
          </button>
        </div>

        <a href="cardapio.html" class="btn-pedir-agora"> Fazer pedido agora </a>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
